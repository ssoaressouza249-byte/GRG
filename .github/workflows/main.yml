name: Build GRX LENTO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Baixar Codigo do Repositorio
        uses: actions/checkout@v4

      - name: 2. Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 5. Compilar APK Debug
        run: gradle assembleDebug --stacktrace

      - name: 6. Publicar APK Pronto (GRX LENTO)
        uses: actions/upload-artifact@v4
        with:
          name: GRX-LENTO-RAYLAN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
