name: Build GRX LENTO APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Corrigir e Compilar APK
        run: |
          DIR=$(dirname $(find . -name "AndroidManifest.xml" | head -n 1) | sed 's|/app/src/main||')
          cd "$DIR"
          mkdir -p gradle app
          rm -rf app/src/test app/src/androidTest
          echo "" | base64 -d > gradle/libs.versions.toml
          sed -i 's/version.ref = "Kotlin"/version.ref = "kotlin"/g' gradle/libs.versions.toml
          sed -i 's/kotlinx_coroutines_/kotlinx-coroutines-/g' gradle/libs.versions.toml
          printf 'plugins {\n  alias(libs.plugins.android.application) apply false\n  alias(libs.plugins.kotlin.android) apply false\n  alias(libs.plugins.kotlin.compose) apply false\n  alias(libs.plugins.google.services) apply false\n}\n' > build.gradle.kts
          printf 'plugins {\n  alias(libs.plugins.android.application)\n  alias(libs.plugins.kotlin.android)\n  alias(libs.plugins.kotlin.compose)\n  alias(libs.plugins.google.services)\n}\nandroid {\n  namespace = "com.example"\n  compileSdk = 34\n  defaultConfig {\n    applicationId = "com.raylan.grxlento"\n    minSdk = 26\n    targetSdk = 34\n    versionCode = 1\n    versionName = "1.0"\n  }\n  compileOptions {\n    sourceCompatibility = JavaVersion.VERSION_17\n    targetCompatibility = JavaVersion.VERSION_17\n  }\n  kotlinOptions { jvmTarget = "17" }\n  buildFeatures { compose = true; buildConfig = true }\n}\ndependencies {\n  implementation(platform(libs.androidx.compose.bom))\n  implementation(platform(libs.firebase.bom))\n  implementation(libs.androidx.activity.compose)\n  implementation(libs.androidx.compose.material.icons.core)\n  implementation(libs.androidx.compose.material.icons.extended)\n  implementation(libs.androidx.compose.material3)\n  implementation(libs.androidx.compose.ui)\n  implementation(libs.androidx.compose.ui.graphics)\n  implementation(libs.androidx.compose.ui.tooling.preview)\n  implementation(libs.androidx.core.ktx)\n  implementation(libs.androidx.lifecycle.runtime.compose)\n  implementation(libs.androidx.lifecycle.runtime.ktx)\n  implementation(libs.androidx.lifecycle.viewmodel.compose)\n  implementation(libs.firebase.ai)\n  implementation(libs.firebase.appcheck.recaptcha)\n  implementation(libs.firebase.appcheck.debug)\n  implementation(libs.kotlinx.coroutines.android)\n  implementation(libs.kotlinx.coroutines.core)\n  implementation(libs.shizuku.api)\n  implementation(libs.shizuku.provider)\n  debugImplementation(libs.androidx.compose.ui.test.manifest)\n  debugImplementation(libs.androidx.compose.ui.tooling)\n}\n' > app/build.gradle.kts

      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          DIR=$(dirname $(find . -name "AndroidManifest.xml" | head -n 1) | sed 's|/app/src/main||')
          cd "$DIR"
          gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: GRX-LENTO-RAYLAN-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
          
